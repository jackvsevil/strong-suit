# One-off before launch: clears test plays, scores, groups and profiles.
# Keeps hands, answer keys and settings.
name: Reset test data
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RESET to delete test data (anything else does nothing)"
        default: ""
      dry_run:
        description: "Just count what would be deleted"
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write   # keyless sign-in to Google Cloud
jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix scripts
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/310245852159/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@strong-suit.iam.gserviceaccount.com
      - run: node scripts/reset-test-data.mjs
        env:
          CONFIRM: ${{ inputs.confirm }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
