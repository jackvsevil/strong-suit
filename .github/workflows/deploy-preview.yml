# Every pull request gets a private preview link (expires after 7 days) to check before going live.
name: Deploy preview (pull requests)
on: pull_request
permissions:
  contents: read
  id-token: write        # keyless sign-in to Google Cloud
  pull-requests: write   # to post the preview link
jobs:
  preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/310245852159/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@strong-suit.iam.gserviceaccount.com
      - name: Deploy preview channel
        id: deploy
        env:
          NO_COLOR: "1"
          CHANNEL: pr${{ github.event.number }}-${{ github.head_ref }}
        run: |
          set -o pipefail
          npx --yes firebase-tools@14.27.0 hosting:channel:deploy "${CHANNEL//\//-}" --expires 7d --project strong-suit --json | tee out.json
          url=$(node -e "const r=require('./out.json');const v=Object.values(r.result||{})[0]||{};console.log(v.url||'')")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::notice title=Preview::$url"
      - name: Comment the link
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          body="Preview: $URL (updated for ${GITHUB_SHA::7}, expires in 7 days)"
          id=$(gh api repos/${{ github.repository }}/issues/${{ github.event.number }}/comments --jq '[.[] | select(.body | startswith("Preview: "))][0].id // empty')
          if [ -n "$id" ]; then gh api -X PATCH repos/${{ github.repository }}/issues/comments/$id -f body="$body" >/dev/null
          else gh api repos/${{ github.repository }}/issues/${{ github.event.number }}/comments -f body="$body" >/dev/null; fi
