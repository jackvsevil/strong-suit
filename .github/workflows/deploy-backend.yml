# Deploys the server code (Cloud Functions) and the database security rules.
name: Deploy server code and rules
on:
  push:
    branches: [v1, main]
    paths: ["functions/**", "firestore.rules", "firestore.indexes.json", "firebase.json", ".github/workflows/deploy-backend.yml"]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write   # keyless sign-in to Google Cloud
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix functions
      - run: npm test --prefix functions
      - name: Admin list (from the ADMIN_EMAILS secret; kept out of the public repo)
        run: |
          printf 'ADMIN_EMAILS=%s\n' "$ADMIN_EMAILS" > functions/.env
          n=$(printf '%s' "$ADMIN_EMAILS" | tr ',' '\n' | grep -c '@' || true)
          echo "::notice title=Admin list::$n admin address(es) set for the admin page"
        env:
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/310245852159/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@strong-suit.iam.gserviceaccount.com
      - name: Deploy
        env:
          NO_COLOR: "1"
        run: |
          set -o pipefail
          npx --yes firebase-tools@14.27.0 deploy --only functions,firestore:rules,firestore:indexes --project strong-suit --non-interactive --force 2>&1 | tee deploy.log
      - name: Report errors
        if: failure()
        run: |
          # one annotation holding the end of the log (GitHub caps annotations at 10 per step)
          msg=$(tail -60 deploy.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Deploy log (last 60 lines)::$msg"
