# Read-only look at the live database: a hand and everyone's plays of it, a player, or any document.
# Results show on the run page (and in the job summary). Nothing is changed.
# The repo is public, so this page is too: answers and the answer key are never printed.
name: Inspect
on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to look at"
        type: choice
        options: [hand, player, doc]
        default: hand
      target:
        description: "hand: a hand number · player: a player ID · doc: a path, e.g. roundStats/3 or players"
        required: true
  # Claude runs it by pushing a one-line inspect-request.txt ("hand 3") to the inspect branch.
  push:
    branches: [inspect]
    paths: [inspect-request.txt]
permissions:
  contents: read
  id-token: write   # keyless sign-in to Google Cloud
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix scripts
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/310245852159/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@strong-suit.iam.gserviceaccount.com
      - run: node scripts/inspect.mjs
        env:
          ACTION: ${{ inputs.action }}
          TARGET: ${{ inputs.target }}
          REQUEST_FILE: ${{ github.event_name == 'push' && 'inspect-request.txt' || '' }}
