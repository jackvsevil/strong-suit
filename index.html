<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Strong Suit has moved</title>
<meta name="description" content="Strong Suit has launched. Play the daily quiz at strongsuitgame.com.">
<link rel="canonical" href="https://strongsuitgame.com/">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:title" content="Strong Suit has launched">
<meta property="og:description" content="The daily quiz that plays to your strengths. Play at strongsuitgame.com.">
<meta property="og:image" content="og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@500..800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{--table:#E6EBF3;--card:#FFFFFF;--ink:#15213B;--muted:#5A6580;--line:#CDD5E3;--back:#1E3B70;--on-back:#FFFFFF;
  --display:"Gabarito","Figtree",system-ui,sans-serif;--body:"Figtree",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--table:#0C1424;--card:#16213A;--ink:#E8EDF7;--muted:#9BA7C0;--line:#2A3858;--back:#8DAEF0;--on-back:#0C1424;color-scheme:dark}}
:root[data-theme="dark"]{--table:#0C1424;--card:#16213A;--ink:#E8EDF7;--muted:#9BA7C0;--line:#2A3858;--back:#8DAEF0;--on-back:#0C1424;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--table);color:var(--ink);font:17px/1.5 var(--body);-webkit-font-smoothing:antialiased;padding:24px 16px}
.card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 24px;text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center}
.wordmark{height:36px;width:auto}
.dark{display:none}
@media (prefers-color-scheme:dark){.light{display:none}.dark{display:block}}
h1{font:600 28px/1.1 var(--display);margin:0;letter-spacing:-.01em}
p{margin:0;color:var(--muted)}
.btn{display:block;width:100%;min-height:54px;line-height:54px;border-radius:14px;background:var(--back);color:var(--on-back);font-weight:700;text-decoration:none}
small{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main class="card">
  <img class="wordmark light" src="brand/logo-light.svg" alt="Strong Suit">
  <img class="wordmark dark" src="brand/logo-dark.svg" alt="Strong Suit" aria-hidden="true">
  <h1>We've launched!</h1>
  <p>Thanks for testing the prototype. Strong Suit now lives at its own address, with a new hand every day, groups to play with friends, and your own stats.</p>
  <a class="btn" href="https://strongsuitgame.com/">Play at strongsuitgame.com</a>
  <small>If you saved this page to your home screen, add the new one instead.</small>
</main>
</body>
</html>
